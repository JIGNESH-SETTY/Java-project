services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: airesearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airesearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airesearch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: airesearch-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/airesearch
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-mock}
      APP_AI_OLLAMA_BASE_URL: ${APP_AI_OLLAMA_BASE_URL:-http://ollama:11434}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-production_quality_secret_key_needs_to_be_at_least_256_bits_long_for_hmac_sha_safety}
      APP_INGESTION_UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: airesearch-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: airesearch-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles:
      - ollama

volumes:
  pgdata:
  backend-uploads:
  ollama-data:
