server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-research-discovery-engine
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:research_discovery}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  upload:
    dir: ./uploads/papers
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  ai:
    provider: ${AI_PROVIDER:MOCK} # Options: MOCK, OLLAMA, OPENAI
    embedding:
      model-name: ${EMBEDDING_MODEL:all-minilm-l6-v2}
      dimension: 384
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat-model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBED_MODEL:text-embedding-3-small}
  grobid:
    enabled: ${GROBID_ENABLED:false}
    base-url: ${GROBID_BASE_URL:http://localhost:8070}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  scholarly:
    crossref:
      mailto: ${CROSSREF_MAILTO:researcher@airesearch.edu}
    openalex:
      mailto: ${OPENALEX_MAILTO:researcher@airesearch.edu}
      api-key: ${OPENALEX_API_KEY:}
    semanticscholar:
      api-key: ${SEMANTIC_SCHOLAR_API_KEY:}
    unpaywall:
      email: ${UNPAYWALL_EMAIL:researcher@airesearch.edu}
    europepmc:
      api-key: ${EUROPE_PMC_API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.airesearch.discovery: DEBUG
    org.springframework.security: INFO
