# ==============================================================================
# Render Blueprint Specification
# AI Research Discovery & Evidence Engine
# ==============================================================================
version: "1"

databases:
  # Managed PostgreSQL 16 with pgvector support
  - name: airesearch-postgres
    databaseName: airesearch
    user: postgres
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # ----------------------------------------------------------------------------
  # Backend API: Spring Boot 3 + Java 21 (Containerized)
  # ----------------------------------------------------------------------------
  - type: web
    name: airesearch-backend
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/auth/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Automatically wire connection string from the managed database
      - key: DATABASE_URL
        fromDatabase:
          name: airesearch-postgres
          property: connectionString
      # AI Provider: MOCK (Zero-cost academic deterministic simulation)
      # Can be switched to OPENAI, GEMINI, or ANTHROPIC by setting API keys
      - key: AI_PROVIDER
        value: MOCK
      # Auto-generate 256-bit cryptographic JWT secret
      - key: JWT_SECRET
        generateValue: true
      # Allow CORS from all origins by default (or set to your frontend domain)
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # Optimized JVM memory parameters for Render free/starter instances
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      - key: APP_INGESTION_UPLOAD_DIR
        value: /app/uploads

  # ----------------------------------------------------------------------------
  # Frontend: React 19 + TypeScript + Vite (Static Site CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: airesearch-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Automatically pass the deployed backend URL to the frontend build
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: airesearch-backend
          property: host

